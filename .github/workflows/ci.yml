name: ci

# PR と main への push でビルド + テストする(#104)。
#
# **なぜ母艦の self-hosted runner か**: private repo の GitHub-hosted の無料枠(アカウント全体で月 2000 分)を
# 使い切ったため、課金せずに回せるよう母艦 Windows PC の runner で動かす。以前の「PR ビルドは self-hosted で
# 走らせない」はやめた(この repo は private で、Renovate が上げた依存が母艦で動くことは受け入れる)。
# public にするなら GitHub-hosted に戻す(fork の PR が runs-on を書き換えて母艦で任意のコードを動かせるため)。
# runner は release.yml と共有の永続 runner(C:\actions-runner\radirec-tool\)で、同時に動くのは 1 ジョブだけ。
# `-windows` TFM のプロジェクト(Airshelf.Cli / Airshelf.Gui)は Windows でそのままビルドできる
# (各 csproj の EnableWindowsTargeting は Linux でビルドする場合のために残っている)。
#
# 出荷物のビルドは release.yml(タグ駆動・self-hosted Windows)が引き続き担う。ここは
# 「マージ前に壊れていないこと」を見るだけで、Velopack の pack/upload は行わない。
on:
  pull_request:
  push:
    branches:
      - main

# 読み取りのみ。ここから Release を作ったり書き込んだりはしない。
permissions:
  contents: read

# 同一 PR/ブランチで新しい push が来たら古い実行は捨てる(release.yml と違い成果物を作らないため安全)。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: [self-hosted, windows, x64, homelab]

    steps:
      # release.yml と同じく commit SHA で pin する(可変メジャータグの repoint 対策。更新時は SHA を張り替える)。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          # runner は非管理者(runner-svc)で動くため、書けるジョブ一時領域へ入れる(release.yml と同じ)。
          DOTNET_INSTALL_DIR: ${{ runner.temp }}\dotnet
        with:
          dotnet-version: '10.0.x'

      # Airshelf.slnx の全プロジェクト(Windows 専用の Cli / Gui を含む)をビルドする。
      # 警告は現状 0 なので -warnaserror で 0 を維持する。SDK 更新で新アナライザが増えて落ちた場合は
      # その指摘を潰すか、必要なら個別に抑制する(release.yml には入れない — リリースを警告で止めないため)。
      - name: Build
        run: dotnet build Airshelf.slnx -c Release -warnaserror --nologo

      - name: Test
        # MTP の dotnet test に --nologo を付けると Linux で「Zero tests ran」になった(#271)。Windows でも当てはまるかは未確認だが、付けない。
        run: dotnet test --solution Airshelf.slnx -c Release --no-build
