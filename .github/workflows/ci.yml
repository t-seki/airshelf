name: ci

# PR と main への push でビルド + テストする(#104)。
#
# **なぜ ubuntu-latest か**: release.yml は「PR ビルドは self-hosted で走らせない」と決めている
# (母艦 Windows PC の runner を PR のコードに晒さない)。その判断は維持したまま PR を検証するため、
# GitHub-hosted の Linux runner を使う。`-windows` TFM のプロジェクト(Airshelf.Cli / Airshelf.Gui)も
# 各 csproj の EnableWindowsTargeting により **Linux でコンパイルできる**
# (Gui は WPF/WinForms のランタイムが無いので実行不可。Cli は Debug ビルドなら Linux でも起動する。
# この CI は -c Release でビルドするだけで、Cli を起動はしない)。
#
# 出荷物のビルドは release.yml(タグ駆動・self-hosted Windows)が引き続き担う。ここは
# 「マージ前に壊れていないこと」を見るだけで、Velopack の pack/upload は行わない。
on:
  pull_request:
  push:
    branches:
      - main

# 読み取りのみ。ここから Release を作ったり書き込んだりはしない。
permissions:
  contents: read

# 同一 PR/ブランチで新しい push が来たら古い実行は捨てる(release.yml と違い成果物を作らないため安全)。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # release.yml と同じく commit SHA で pin する(可変メジャータグの repoint 対策。更新時は SHA を張り替える)。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # Airshelf.slnx の全プロジェクト(Windows 専用の Cli / Gui を含む)をビルドする。
      # 警告は現状 0 なので -warnaserror で 0 を維持する。SDK 更新で新アナライザが増えて落ちた場合は
      # その指摘を潰すか、必要なら個別に抑制する(release.yml には入れない — リリースを警告で止めないため)。
      - name: Build
        run: dotnet build Airshelf.slnx -c Release -warnaserror --nologo

      - name: Test
        run: ls -la tests/Airshelf.Tests/bin/Release/net10.0/ | head -20; tests/Airshelf.Tests/bin/Release/net10.0/Airshelf.Tests 2>&1 | tail -5; dotnet test --project tests/Airshelf.Tests/Airshelf.Tests.csproj -c Release --no-build --nologo --output Detailed --diagnostic --diagnostic-verbosity Trace --diagnostic-output-directory /tmp/d 2>&1 | tail -5; ls /tmp/d; cat /tmp/d/* | cut -c1-250 | tail -40; exit 1
