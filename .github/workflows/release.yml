name: release

# タグ push で成果物をビルドし GitHub Release へ添付する(ADR-0005 / ADR-0007。#16)。
# セキュリティ上・機能上ともタグ push のみをトリガにする(PR ビルドは self-hosted で走らせない)。
on:
  push:
    tags:
      - 'v*'

# Release 作成に必要な最小権限。
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # 母艦 Windows PC の self-hosted runner(runner-svc 実行)。homelab runbook のラベルに合わせる。
    runs-on: [self-hosted, windows, x64, homelab]

    steps:
      # self-hosted + contents:write のため、third-party/first-party とも commit SHA で pin する
      # (可変メジャータグの repoint による供給網 RCE を防ぐ。更新時は SHA を張り替える)。
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          clean: true

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        env:
          # runner は非管理者(runner-svc)で動くため setup-dotnet の既定 C:\Program Files\dotnet に
          # 書けない。runner が書けるジョブ一時領域へ入れる(setup-dotnet が PATH を後続へ前置する)。
          # runner コンテキストは step レベルでのみ有効(job env では使えない)。
          DOTNET_INSTALL_DIR: ${{ runner.temp }}\dotnet
        with:
          dotnet-version: '10.0.x'

      # タグ名はそのまま run に展開せず env 経由で受ける(タグ名インジェクション対策)。
      # 版は semver に限定して検証し、非 semver タグ(vlatest 等)は明示的に失敗させる。
      - name: Derive version from tag
        id: ver
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $v = $env:TAG -replace '^v', ''
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
              throw "タグ '$env:TAG' が semver ではありません(vMAJOR.MINOR.PATCH[-prerelease] を使ってください)"
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version = $v"

      - name: Test
        shell: pwsh
        run: dotnet test Radirec.slnx -c Release --nologo

      - name: Publish single-file exe
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # サービス/CLI(radirec.exe)と取込通知トレイ(Radirec.Gui.exe)を別ディレクトリへ publish。
          # 両者とも単一自己完結 exe(ADR-0005 / 0009)。GUI は Windows ランナー上で WPF がビルドされる。
          dotnet publish src/Radirec.Cli -c Release -p:Version=$env:VERSION -o publish/cli
          dotnet publish src/Radirec.Gui -c Release -p:Version=$env:VERSION -o publish/gui

      - name: Assemble release package
        id: pkg
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $stage = "radirec-$env:VERSION-win-x64"
          New-Item -ItemType Directory -Path "$stage/deploy", "$stage/config" -Force | Out-Null
          # 配布物: 2 つの単一 exe(サービス/CLI + 取込通知トレイ)+ 運用スクリプト + sample 設定のみ。
          # 実 config・pdb は含めない。
          Copy-Item publish/cli/radirec.exe "$stage/"
          Copy-Item publish/gui/Radirec.Gui.exe "$stage/"
          Copy-Item deploy/*.ps1 "$stage/deploy/"
          Copy-Item config/*.sample.json "$stage/config/"
          $zip = "$stage.zip"
          # ディレクトリごと圧縮し、展開時に radirec-<ver>-win-x64/ ラッパーを保つ(ファイル散乱を防ぐ)。
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: ${{ steps.pkg.outputs.zip }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          # prerelease semver(タグ名に '-' を含む。例 v0.3.0-rc1)は prerelease として発行し、
          # RC が /releases/latest を汚染しないようにする(#45)。安定版(v0.3.0 等)は false。
          prerelease: ${{ contains(github.ref_name, '-') }}
