name: release

# タグ push で成果物をビルドし GitHub Release へ添付する(ADR-0005 / ADR-0007。#16)。
# タグ push のみをトリガにする(contents: write で Release を作るため、PR や main への push では動かさない。
# PR の検証は ci.yml が同じ runner で行う)。
on:
  push:
    tags:
      - 'v*'

# Release 作成に必要な最小権限。
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # 母艦 Windows PC の self-hosted runner(runner-svc 実行)。homelab runbook のラベルに合わせる。
    runs-on: [self-hosted, windows, x64, homelab]

    steps:
      # self-hosted + contents:write のため、third-party/first-party とも commit SHA で pin する
      # (可変メジャータグの repoint による供給網 RCE を防ぐ。更新時は SHA を張り替える)。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          # runner は非管理者(runner-svc)で動くため setup-dotnet の既定 C:\Program Files\dotnet に
          # 書けない。runner が書けるジョブ一時領域へ入れる(setup-dotnet が PATH を後続へ前置する)。
          # runner コンテキストは step レベルでのみ有効(job env では使えない)。
          DOTNET_INSTALL_DIR: ${{ runner.temp }}\dotnet
        with:
          dotnet-version: '10.0.x'

      # タグ名はそのまま run に展開せず env 経由で受ける(タグ名インジェクション対策)。
      # 版は semver に限定して検証し、非 semver タグ(vlatest 等)は明示的に失敗させる。
      - name: Derive version from tag
        id: ver
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $v = $env:TAG -replace '^v', ''
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
              throw "タグ '$env:TAG' が semver ではありません(vMAJOR.MINOR.PATCH[-prerelease] を使ってください)"
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version = $v"

      - name: Test
        # MTP の dotnet test に --nologo を付けると Linux の CI で「Zero tests ran」になった(#271)。付けない。
        shell: pwsh
        run: dotnet test --solution Airshelf.slnx -c Release

      # トレイ(Airshelf.Gui.exe)と単発 CLI(airshelf.exe)を **1 フォルダ**へ publish する。
      # Velopack は「フォルダ一式」を配布物として扱うため、単一 exe ではなく self-contained の
      # 通常 publish にする(PublishSingleFile を明示 off で csproj の Release 既定を上書き)。ADR-0013。
      - name: Publish app folder
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $pub = "publish"
          dotnet publish src/Airshelf.Gui -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=false -p:Version=$env:VERSION -o $pub
          dotnet publish src/Airshelf.Cli -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=false -p:Version=$env:VERSION -o $pub

      # Velopack CLI(vpk)を導入し PATH へ通す。self-hosted runner は永続でツールが残るため、
      # install(既存だと非ゼロ終了)ではなく **update で冪等**にし、**版を 1.2.161 に固定**する
      # (パッケージ Velopack 1.2.161 と vpk の版一致が要る。Directory.Packages.props に追従)。
      - name: Install vpk
        shell: pwsh
        run: |
          dotnet tool update -g vpk --version 1.2.161
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      # 直近リリースを取得して delta の差分基準にする。初回(Velopack リリースがまだ無い)は
      # 取得対象が無く失敗しうるので握りつぶす(delta は最適化・full package は常に出る)。
      - name: Download previous release (delta base)
        continue-on-error: true
        shell: pwsh
        env:
          VPK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: vpk download github --repoUrl "${{ github.server_url }}/${{ github.repository }}"

      # 差分の基準から、packId が Airshelf でない旧パッケージを外す(ADR-0022 の改名。最初の Airshelf のリリースだけ効く)。
      # vpk 1.2.161 のソースで確かめたこと:
      # - `vpk download github` は、packId に関係なく最新の Full の nupkg(`{packId}-{版}-full.nupkg`)を 1 つ Releases/ に落とす
      #   (DownloadCommandRunner.RunCoreAsync)。改名直後は旧 Radirec のものになる。
      # - `vpk pack` は Releases/ の nupkg を channel だけで束ね、packId を見ない(ReleaseEntryHelper)。そのため旧 Radirec の
      #   nupkg を前の版として拾い、Radirec → Airshelf の delta を作る(DeltaPackageBuilder も packId を確かめない)。
      #   エラーにはならないが、別アプリの版を基準にした delta が Release に載り、手元の releases.win.json にも両方が混ざる。
      # - `vpk upload github` が上げるフィードは、この pack で作った資産だけで組む(BuildAssets)。手元の混ざりは上がらない。
      # 外すと最初の Airshelf のリリースは delta 無し(full だけ)で出る。2 回目以降は Airshelf の nupkg しか落ちないので何もしない。
      - name: Drop delta base of other packId
        shell: pwsh
        run: |
          Get-ChildItem -Path Releases -Filter *.nupkg -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notlike 'Airshelf-*' } |
            ForEach-Object { Write-Host "差分の基準から外す: $($_.Name)"; Remove-Item $_.FullName -Force }

      # Setup.exe / full+delta nupkg / portable / フィード manifest を生成し、GitHub Release へ発行する。
      # bool フラグ(--publish / --pre)は値を取るため env 変数(VPK_PUBLISH / VPK_PRE)で渡す。
      # prerelease semver(タグに '-'。例 v0.7.0-rc1)は VPK_PRE=true で prerelease として発行(#45)。
      # private repo でも CI の GITHUB_TOKEN(contents:write)で発行できる(受け手側のトークンは別・ADR-0013)。
      - name: Pack and upload (Velopack)
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ github.ref_name }}
          VPK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPK_PUBLISH: "true"
          VPK_PRE: ${{ contains(github.ref_name, '-') }}
        run: |
          $repo = "${{ github.server_url }}/${{ github.repository }}"
          vpk pack -u Airshelf -v $env:VERSION -p publish -e Airshelf.Gui.exe `
            --packTitle "Airshelf" --icon src/Airshelf.Gui/Assets/airshelf.ico
          vpk upload github --repoUrl $repo --tag $env:TAG --releaseName "Airshelf $env:VERSION"
