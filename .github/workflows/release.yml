name: release

# タグ push で成果物をビルドし GitHub Release へ添付する(ADR-0005 / ADR-0007。#16)。
# セキュリティ上・機能上ともタグ push のみをトリガにする(PR ビルドは self-hosted で走らせない)。
on:
  push:
    tags:
      - 'v*'

# Release 作成に必要な最小権限。
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # 母艦 Windows PC の self-hosted runner(runner-svc 実行)。homelab runbook のラベルに合わせる。
    runs-on: [self-hosted, windows, x64, homelab]

    env:
      # runner は非管理者(runner-svc)で動くため、setup-dotnet の既定 C:\Program Files\dotnet に
      # 書けない。runner が書けるジョブ一時領域へ SDK を入れる(setup-dotnet が PATH に前置する)。
      DOTNET_INSTALL_DIR: ${{ runner.temp }}\dotnet

    steps:
      # self-hosted + contents:write のため、third-party/first-party とも commit SHA で pin する
      # (可変メジャータグの repoint による供給網 RCE を防ぐ。更新時は SHA を張り替える)。
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          clean: true

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      # タグ名はそのまま run に展開せず env 経由で受ける(タグ名インジェクション対策)。
      # 版は semver に限定して検証し、非 semver タグ(vlatest 等)は明示的に失敗させる。
      - name: Derive version from tag
        id: ver
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $v = $env:TAG -replace '^v', ''
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
              throw "タグ '$env:TAG' が semver ではありません(vMAJOR.MINOR.PATCH[-prerelease] を使ってください)"
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version = $v"

      - name: Test
        shell: pwsh
        run: dotnet test Radirec.slnx -c Release --nologo

      - name: Publish single-file exe
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: dotnet publish src/Radirec.Cli -c Release -p:Version=$env:VERSION -o publish

      - name: Assemble release package
        id: pkg
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $stage = "radirec-$env:VERSION-win-x64"
          New-Item -ItemType Directory -Path "$stage/deploy", "$stage/config" -Force | Out-Null
          # 配布物: 単一 exe + 運用スクリプト + sample 設定のみ。実 config・pdb は含めない。
          Copy-Item publish/radirec.exe "$stage/"
          Copy-Item deploy/*.ps1 "$stage/deploy/"
          Copy-Item config/*.sample.json "$stage/config/"
          $zip = "$stage.zip"
          # ディレクトリごと圧縮し、展開時に radirec-<ver>-win-x64/ ラッパーを保つ(ファイル散乱を防ぐ)。
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ${{ steps.pkg.outputs.zip }}
          fail_on_unmatched_files: true
          generate_release_notes: true
