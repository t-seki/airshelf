version: 2

# 依存の更新・脆弱性を PR として受け取る(#106)。
#
# **なぜ CI ではなくここか**: ci.yml は `-warnaserror` で走るが、Directory.Build.props で
# NuGetAudit の警告(NU1901-1904)をエラーから除外している。依存に新規 CVE が登録された日に
# **こちらのコードを変えていない PR が落ちる**のを避けるため(#105)。その代わり、脆弱性と
# 更新はここで PR として能動的に届ける — ログに出して誰も読まない状態にしない。
#
# 上がってきた PR は ci.yml がそのままビルド + テストするので、手で確認する量は小さい。
updates:
  # NuGet(Directory.Packages.props で中央管理)。
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # patch/minor はまとめて 1 PR。個別に見る価値が薄く、PR 数だけ増えるため。
      minor-and-patch:
        update-types:
          - minor
          - patch
    # major は破壊的変更を含みうるのでグループに入れず個別 PR にする(既定の挙動)。

  # GitHub Actions。release.yml / ci.yml は action を commit SHA で pin しており、
  # 「更新時は SHA を張り替える」運用が手作業だと途切れる(実際 checkout v7.0.1 /
  # setup-dotnet v6.0.0 が出たのに v7.0.0 / v5.4.0 のままだった)。Dependabot は
  # SHA pin を維持したままバージョンコメントごと張り替えてくれる。
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
